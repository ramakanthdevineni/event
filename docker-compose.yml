x-app-env: &app-env
  PORT: "8080"
  DB_TYPE: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-vms}
  DB_USERNAME: ${DB_USERNAME:-vms}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in .env}
  DEFAULT_NEW_USER_PASSWORD: ${DEFAULT_NEW_USER_PASSWORD:?Set DEFAULT_NEW_USER_PASSWORD in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
  LOGIN_WINDOW_MS: ${LOGIN_WINDOW_MS:-300000}
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
  SESSION_CACHE_TTL_MS: ${SESSION_CACHE_TTL_MS:-60000}
  SESSION_CLEANUP_INTERVAL_MS: ${SESSION_CLEANUP_INTERVAL_MS:-300000}
  MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vms}
      MYSQL_USER: ${DB_USERNAME:-vms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-vms}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Monolithic API — one JVM serves all endpoints (better under high concurrency than 5 separate services).
  api:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: all
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: mysql:8.4
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-vms}
      DB_USERNAME: ${DB_USERNAME:-vms}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-30}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -eu
        mkdir -p /backups
        echo "MySQL backup loop started (every $${BACKUP_INTERVAL_SECONDS}s)"
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          file="/backups/vms-$${stamp}.sql.gz"
          if mysqldump -h"$${DB_HOST}" -u"$${DB_USERNAME}" -p"$${DB_PASSWORD}" --single-transaction --no-tablespaces --routines --triggers "$${DB_NAME}" | gzip -c >"$$file"; then
            echo "Backup OK: $$file"
            keep="$${BACKUP_RETENTION_COUNT:-30}"
            ls -1t /backups/vms-*.sql.gz 2>/dev/null | tail -n +$$((keep + 1)) | xargs -r rm -f || true
          else
            echo "Backup FAILED at $$stamp" >&2
            rm -f "$$file"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
