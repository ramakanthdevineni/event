x-app-env: &app-env
  PORT: "8080"
  DB_TYPE: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-vms}
  DB_USERNAME: ${DB_USERNAME:-vms}
  DB_PASSWORD: ${DB_PASSWORD:-vms}
  DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Certified01$}
  DEFAULT_NEW_USER_PASSWORD: ${DEFAULT_NEW_USER_PASSWORD:-Match123$}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
  LOGIN_WINDOW_MS: ${LOGIN_WINDOW_MS:-300000}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vms}
      MYSQL_USER: ${DB_USERNAME:-vms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vms-root-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-vms}", "-p${DB_PASSWORD:-vms}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  core:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: core
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  users:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: users
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  admin:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: admin
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  status:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: status
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  mapview:
    build: .
    environment:
      <<: *app-env
      SERVICE_NAME: mapview
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      core:
        condition: service_healthy
      users:
        condition: service_healthy
      admin:
        condition: service_healthy
      status:
        condition: service_healthy
      mapview:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: mysql:8.4
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-vms}
      DB_USERNAME: ${DB_USERNAME:-vms}
      DB_PASSWORD: ${DB_PASSWORD:-vms}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -eu
        mkdir -p /backups
        echo "MySQL backup loop started (every $${BACKUP_INTERVAL_SECONDS}s)"
        while true; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          file="/backups/vms-$${stamp}.sql.gz"
          if mysqldump -h"$${DB_HOST}" -u"$${DB_USERNAME}" -p"$${DB_PASSWORD}" --single-transaction --no-tablespaces --routines --triggers "$${DB_NAME}" | gzip -c >"$$file"; then
            echo "Backup OK: $$file"
            ls -1t /backups/vms-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f || true
          else
            echo "Backup FAILED at $$stamp" >&2
            rm -f "$$file"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
