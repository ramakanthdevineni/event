services:
  core:
    build: .
    environment:
      - PORT=8080
      - SERVICE_NAME=core
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  users:
    build: .
    environment:
      - PORT=8080
      - SERVICE_NAME=users
    volumes:
      - ./data:/app/data
    depends_on:
      - core
    restart: unless-stopped

  admin:
    build: .
    environment:
      - PORT=8080
      - SERVICE_NAME=admin
    volumes:
      - ./data:/app/data
    depends_on:
      - core
    restart: unless-stopped

  status:
    build: .
    environment:
      - PORT=8080
      - SERVICE_NAME=status
    volumes:
      - ./data:/app/data
    depends_on:
      - core
    restart: unless-stopped

  mapview:
    build: .
    environment:
      - PORT=8080
      - SERVICE_NAME=mapview
    volumes:
      - ./data:/app/data
    depends_on:
      - core
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core
      - users
      - admin
      - status
      - mapview
    restart: unless-stopped
