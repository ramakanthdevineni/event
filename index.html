<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VMS Sign In</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --panel: #0b1220;
        --field: #111827;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 50% 20%, rgba(37, 99, 235, 0.35), transparent 55%),
          linear-gradient(160deg, #020617 0%, #0f172a 45%, #1e3a8a 100%);
      }

      .card {
        width: min(100%, 400px);
        padding: 2rem 1.75rem 1.75rem;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
        text-align: left;
      }

      .brand {
        margin: 0 0 0.35rem;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.15;
      }

      .tagline {
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .login-form {
        display: grid;
        gap: 0.95rem;
      }

      .login-form label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.88rem;
        color: var(--muted);
      }

      .login-form input {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: var(--field);
        color: #ffffff;
        caret-color: #ffffff;
        font-size: 1rem;
        line-height: 1.35;
        outline: none;
        -webkit-text-fill-color: #ffffff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .login-form input::placeholder {
        color: #94a3b8;
        opacity: 1;
        -webkit-text-fill-color: #94a3b8;
      }

      .login-form input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
        background: #0f172a;
      }

      .login-form input:-webkit-autofill,
      .login-form input:-webkit-autofill:hover,
      .login-form input:-webkit-autofill:focus {
        -webkit-text-fill-color: #ffffff;
        caret-color: #ffffff;
        box-shadow: 0 0 0 1000px var(--field) inset;
        transition: background-color 9999s ease-out;
      }

      .login-form button {
        margin-top: 0.35rem;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .login-form button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .login-form button:focus-visible {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="brand">VMS</h1>
      <p class="tagline">Hello Venue Technology Team</p>
      <form class="login-form" action="/login" method="post">
        <div>
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div>
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">Sign In</button>
      </form>
    </main>
  </body>
</html>
