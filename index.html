<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #2563eb);
        color: #f8fafc;
      }

      .card {
        text-align: center;
        padding: 3rem 4rem;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.8rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello Ram</h1>
      <p>Welcome to your new home page.</p>
    </main>
  </body>
</html>
