spring.application.name=vms
server.port=${PORT:8080}

app.service-name=${SERVICE_NAME:all}
app.session-timeout-ms=300000
app.default-admin-username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-admin-password=${DEFAULT_ADMIN_PASSWORD:Certified01$}
app.default-new-user-password=${DEFAULT_NEW_USER_PASSWORD:Match123$}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.login-max-attempts=${LOGIN_MAX_ATTEMPTS:10}
app.login-window-ms=${LOGIN_WINDOW_MS:300000}
app.db-pool-max-size=${DB_POOL_MAX_SIZE:3}
app.session-cache-ttl-ms=${SESSION_CACHE_TTL_MS:30000}
app.session-cleanup-interval-ms=${SESSION_CLEANUP_INTERVAL_MS:300000}
app.max-sessions-per-user=${MAX_SESSIONS_PER_USER:5}
app.redis-host=${REDIS_HOST:}
app.redis-port=${REDIS_PORT:6379}

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}

app.db-type=${DB_TYPE:mysql}
app.db-host=${DB_HOST:mysql}
app.db-port=${DB_PORT:3306}
app.db-name=${DB_NAME:vms}
app.db-username=${DB_USERNAME:vms}
app.db-password=${DB_PASSWORD:vms}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.pathmatch.matching-strategy=path_pattern_parser

logging.level.org.springframework.web=INFO
